services:
  - type: web
    name: careflow-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard — paste your Neon connection string
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL, e.g. https://careflow-ai.vercel.app
      - key: GROQ_API_KEY
        sync: false   # Optional — leave blank to use rule-based AI fallback
      - key: PROJECT_NAME
        value: CareFlow AI
      - key: API_V1_STR
        value: /api/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
